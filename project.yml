name: RemoteMapper
options:
  bundleIdPrefix: com.ws
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  RemoteKit:
    path: Packages/RemoteKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: VVB976RN4W
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "3"

# 两个版本共用的源码与设置
targetTemplates:
  RemoteMapperApp:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: RemoteKit
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Development
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        DEAD_CODE_STRIPPING: YES

targets:
  # 官网版：Developer ID 签名 + 公证，功能完整
  RemoteMapper:
    templates: [RemoteMapperApp]
    sources:
      - path: build/Microphone
        type: folder
        buildPhase: resources
        optional: true
    dependencies:
      - package: RemoteKit
        product: RemoteKit
      - package: RemoteKit
        product: RemoteKitTouch
      - package: RemoteKit
        product: RemoteKitScripts
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: RemoteMapper
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations: [zh-Hans]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.developer-tools
        NSAppleEventsUsageDescription: RemoteMapper 需要发送 Apple 事件来执行你绑定到遥控器上的 AppleScript。
        NSBluetoothAlwaysUsageDescription: RemoteMapper 通过蓝牙读取 Siri Remote 的电量与连接状态。
        NSMicrophoneUsageDescription: 语音输入：按住遥控器上的键时用麦克风录音，并在本机转成文字。
        NSSpeechRecognitionUsageDescription: 语音输入：在本机把你说的话转成文字。
        NSHumanReadableCopyright: ""
    entitlements:
      path: App/RemoteMapper.entitlements
      properties:
        com.apple.security.automation.apple-events: true
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ws.RemoteMapper
        PRODUCT_NAME: RemoteMapper

  # App Store 版：沙盒，去掉私有接口与执行外部命令的功能
  RemoteMapperLite:
    templates: [RemoteMapperApp]
    info:
      path: App/Lite-Info.plist
      properties:
        CFBundleDisplayName: RemoteMapper Lite
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations: [zh-Hans]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.developer-tools
        NSBluetoothAlwaysUsageDescription: RemoteMapper Lite 通过蓝牙读取 Siri Remote 的电量。
        NSMicrophoneUsageDescription: 语音输入：按住遥控器上的键时用麦克风录音，并在本机转成文字。
        NSSpeechRecognitionUsageDescription: 语音输入：在本机把你说的话转成文字。
        NSHumanReadableCopyright: ""
    entitlements:
      path: App/RemoteMapperLite.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.device.audio-input: true
        com.apple.security.device.bluetooth: true
        com.apple.security.device.usb: true
        com.apple.security.files.user-selected.read-only: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ws.RemoteMapper.Lite
        PRODUCT_NAME: RemoteMapper Lite
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) APP_STORE

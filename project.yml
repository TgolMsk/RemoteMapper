name: RemoteMapper
options:
  bundleIdPrefix: com.ws
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  RemoteKit:
    path: Packages/RemoteKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: VVB976RN4W
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  RemoteMapper:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: RemoteKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: RemoteMapper
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations: [zh-Hans]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.developer-tools
        NSAppleEventsUsageDescription: RemoteMapper 需要发送 Apple 事件来执行你绑定到遥控器上的 AppleScript。
        NSHumanReadableCopyright: ""
    entitlements:
      path: App/RemoteMapper.entitlements
      properties:
        com.apple.security.automation.apple-events: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ws.RemoteMapper
        PRODUCT_NAME: RemoteMapper
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Development
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        DEAD_CODE_STRIPPING: YES
